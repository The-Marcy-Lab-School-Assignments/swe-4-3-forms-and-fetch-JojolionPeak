<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeFinderApp</title>
  </head>
  <body>
    <h2>Pokemon!</h2>
    <p id="error"></p>
    <p id="success"></p>
    <form
      id="capture-form"
      action="https://formspree.io/f/mgolvaby"
      method="POST"
    >
      <h2>Capture Pokemon</h2>
      <div id="name-div">
        <label for="name">Name</label>
        <input
          type="text"
          placeholder="Pokemon name here"
          id="name"
          name="Poke-name"
        />
      </div>

      <div id="types-div">
        <label for="types">Types</label>
        <input
          type="text"
          placeholder="Pokemon types here"
          id="types"
          name="types"
        />
      </div>

      <div id="fav">
        <label for="fav-mon">Favorite</label>
        <input type="checkbox" id="fav-mon" name="favorite" />
      </div>

      <button id="catch" type="submit">Capture</button>
    </form>
    <h2>Discovered Pokemon</h2>
    <button id="discover-btn">Encounter Pokemon</button>
    <ul id="discovered-list">
      <!--  -->
    </ul>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
